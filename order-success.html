<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Success - BARQ</title>

<link rel="stylesheet" href="order-success.css">

</head>


<body>


<div class="success-page">


    <div class="success-box">


        <div class="success-icon">
            ✓
        </div>


        <h1>
            Thank You!
        </h1>


        <p class="success-message">
            Your order has been received successfully.
        </p>



        <div class="order-details">


            <h2>
                Order Details
            </h2>


            <p>
                Order Number:
                <strong id="order-number">
                    BARQ0000
                </strong>
            </p>


            <p>
                Total:
                <strong id="order-total">
                    SAR 0.00
                </strong>
            </p>


        </div>



        <a href="index.html" class="continue-btn">
            Continue Shopping
        </a>


    </div>


</div>



<script>

const order =
JSON.parse(localStorage.getItem("barqOrder"));


if(order){

document.getElementById("order-number").textContent =
order.orderNumber;


document.getElementById("order-total").textContent =
"SAR " + order.total.toFixed(2);


}


</script>


</body>

</html>
