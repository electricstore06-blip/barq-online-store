<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BARQ | Product Details</title>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="favicon.ico">

<style>

.product-details-page{

padding:40px;

display:flex;

gap:40px;

flex-wrap:wrap;

max-width:1200px;

margin:auto;

}



.product-image-box{

flex:1;

min-width:300px;

text-align:center;

}



.product-image-box img{

width:100%;

max-width:420px;

height:420px;

object-fit:contain;

border-radius:20px;

}



.product-info{

flex:1;

min-width:300px;

}



.product-info h1{

font-size:35px;

}



.price-box{

font-size:28px;

font-weight:bold;

margin:20px 0;

}



.option-title{

font-weight:bold;

margin-top:20px;

}



.option-buttons button{

margin:5px;

padding:10px 18px;

border-radius:20px;

border:1px solid #ccc;

background:white;

cursor:pointer;

}



.add-cart-btn{

margin-top:30px;

padding:15px 40px;

background:black;

color:white;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

}


</style>

</head>


<body>


<div class="top-bar">

🚚 Free Shipping | ❤️ Authentic Products | 🔒 Secure Payment

</div>



<header>

<div class="logo">

⚡ BARQ

<span>
ONLINE STORE
</span>

</div>


<nav id="mainNav">

<a href="index.html">
Home
</a>


<a href="index.html#products">
Shop
</a>


<a href="orders.html">
My Orders
</a>


<a href="#" onclick="openCart();return false;">

🛒 Cart

<span id="cartCount">
0
</span>

</a>


</nav>


</header>





<section id="productDetails">

<p>
Loading product...
</p>


</section>





<div id="cartBox" class="cart-box">


<h2>Your Cart</h2>


<div id="cartItems"></div>


<h3>

Total:

<span id="cartTotal">
0
</span>

SAR

</h3>


<button onclick="checkout()">
Checkout
</button>


<button onclick="closeCart()">
Close
</button>


</div>



<script type="module" src="script.js"></script>
<script type="module" src="product-details.js"></script>



</body>


</html>
