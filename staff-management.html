<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BARQ Staff Management</title>

<link rel="stylesheet" href="staff-management.css">

</head>


<body>


<div class="staff-page">


<header class="staff-header">

    <h1>
        BARQ Staff Management
    </h1>

    <button id="back-btn">
        Back
    </button>

</header>



<main class="staff-container">


<h2>
    Create Staff Account
</h2>



<div class="staff-form">


<input 
type="text"
id="staff-name"
placeholder="Full Name"
>



<input 
type="email"
id="staff-email"
placeholder="Email Address"
>



<input 
type="tel"
id="staff-phone"
placeholder="Phone Number"
>



<select id="staff-role">


<option value="">
Select Role
</option>


<option value="supervisor">
Supervisor
</option>


<option value="driver">
Driver
</option>


</select>




<input 
type="text"
id="staff-city"
placeholder="City"
>



<input 
type="password"
id="staff-password"
placeholder="Password"
>



<button id="create-staff-btn">

Create Staff Account

</button>


</div>



<p id="staff-message">

</p>



</main>


</div>



<script type="module" src="staff-management.js"></script>


</body>

</html>
