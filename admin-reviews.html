```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARQ Admin - Customer Reviews</title>
  <link rel="stylesheet" href="admin-reviews.css">
</head>
<body>
  <header class="admin-header">
    <div>
      <h1>BARQ Admin</h1>
      <p>Customer Product Reviews</p>
    </div>
    <a href="admin-products.html">Back to Admin</a>
  </header>

  <main class="container">
    <h2>Customer Reviews</h2>
    <p>Review customer feedback before it appears publicly.</p>

    <div id="admin-message" role="status">
      Checking admin access...
    </div>

    <section id="reviews-section" hidden>
      <div class="toolbar">
        <label for="status-filter">Show reviews:</label>
        <select id="status-filter">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="all">All reviews</option>
        </select>
        <button id="refresh-btn" type="button">Refresh</button>
      </div>

      <div id="reviews-container"></div>
    </section>
  </main>

  <script type="module" src="admin-reviews.js"></script>
</body>
```
