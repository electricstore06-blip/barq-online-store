<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BARQ Checkout</title>

    <link rel="stylesheet" href="checkout.css">

</head>


<body>

<div class="checkout-page">

    <h1>BARQ Checkout</h1>


    <div class="checkout-box">

        <h2>Customer Information</h2>


        <label for="fullname">
            Full Name
        </label>

        <input
            type="text"
            id="fullname"
            placeholder="Enter your name"
        >


        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="05xxxxxxxx"
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="example@email.com"
        >


        <label for="address">
            Delivery Address
        </label>

        <textarea
            id="address"
            placeholder="Your address"
        ></textarea>


        <h2>Payment Method</h2>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="Mada"
            >

            <span>Mada</span>

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="Visa / Mastercard"
            >

            <span>Visa / Mastercard</span>

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="Apple Pay"
            >

            <span>Apple Pay</span>

        </label>


        <button type="button">
            Place Order
        </button>


    </div>

</div>

</body>

</html>
