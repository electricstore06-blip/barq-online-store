<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BARQ Checkout</title>

    <link rel="stylesheet" href="checkout.css">

</head>


<body>


<div class="checkout-page">


    <h1>BARQ Checkout</h1>


    <div class="checkout-box">


        <!-- CUSTOMER INFORMATION -->

        <h2>Customer Information</h2>


        <label for="full-name">
            Full Name
        </label>

        <input
            type="text"
            id="full-name"
            name="full-name"
            placeholder="Enter your name"
            required
        >


        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="05xxxxxxxx"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
        >


        <label for="address">
            Delivery Address
        </label>

        <textarea
            id="address"
            name="address"
            placeholder="Your address"
            required
        ></textarea>



        <!-- PAYMENT METHOD -->

        <h2>Payment Method</h2>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="Mada"
                required
            >

            <span>Mada</span>

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="Visa / Mastercard"
            >

            <span>Visa / Mastercard</span>

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="Apple Pay"
            >

            <span>Apple Pay</span>

        </label>



        <!-- PLACE ORDER -->

        <button type="button">
            Place Order
        </button>


    </div>


</div>


</body>

</html>
