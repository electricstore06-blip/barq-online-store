<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BARQ Checkout</title>

    <link rel="stylesheet" href="checkout.css">

</head>


<body>


<div class="checkout-page">


    <h1>
        BARQ Checkout
    </h1>


    <div class="checkout-box">


        <label>
            Full Name
        </label>

        <input
            type="text"
            id="fullName"
            placeholder="Enter your name"
        >


        <label>
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="05xxxxxxxx"
        >


        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="example@email.com"
        >


        <label>
            Delivery Address
        </label>

        <textarea
            id="address"
            placeholder="Your address"
        ></textarea>


        <h2>
            Payment Method
        </h2>


        <label>

            <input
                type="radio"
                name="payment"
                value="Mada"
            >

            Mada

        </label>


        <label>

            <input
                type="radio"
                name="payment"
                value="Visa / Mastercard"
            >

            Visa / Mastercard

        </label>


        <label>

            <input
                type="radio"
                name="payment"
                value="Apple Pay"
            >

            Apple Pay

        </label>


        <button
            id="placeOrderBtn"
            type="button"
        >
            Place Order
        </button>


    </div>


</div>


<script
    type="module"
    src="checkout.js"
></script>


</body>

</html>
