<!DOCTYPE html>
<html>

<head>

<title>
BARQ Checkout
</title>

<link rel="stylesheet" href="checkout.css">

</head>


<body>


<div class="checkout-page">


<h1>
BARQ Checkout
</h1>



<div class="checkout-box">



<label>
Full Name
</label>

<input type="text" placeholder="Enter your name">



<label>
Phone Number
</label>

<input type="text" placeholder="05xxxxxxxx">



<label>
Email
</label>

<input type="email" placeholder="example@email.com">



<label>
Delivery Address
</label>

<textarea placeholder="Your address"></textarea>





<h2>
Payment Method
</h2>



<label>

<input type="radio" name="payment">

Mada

</label>



<label>

<input type="radio" name="payment">

Visa / Mastercard

</label>



<label>

<input type="radio" name="payment">

Apple Pay

</label>





<button>
Place Order
</button>



</div>


</div>



</body>


</html>
