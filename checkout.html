<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BARQ Checkout</title>

    <link rel="stylesheet" href="checkout.css">

    <script src="checkout.js" defer></script>

</head>

<body>

    <div class="checkout-page">

        <h1>BARQ Checkout</h1>

        <div class="checkout-box">


            <!-- ==============================
                 ORDER SUMMARY
            =============================== -->

            <div class="order-summary">

                <h2>Order Summary</h2>

                <div id="order-items"></div>

                <div class="summary-row">

                    <span>Subtotal</span>

                    <span id="subtotal">
                        SAR 0.00
                    </span>

                </div>

                <div class="summary-row">

                    <span>Delivery</span>

                    <span id="delivery">
                        SAR 0.00
                    </span>

                </div>

                <div class="summary-total">

                    <span>Total</span>

                    <strong id="total">
                        SAR 0.00
                    </strong>

                </div>

            </div>


            <!-- ==============================
                 CUSTOMER INFORMATION
            =============================== -->

            <h2 class="customer-title">
                Customer Information
            </h2>


            <label for="full-name">
                Full Name
            </label>

            <input
                type="text"
                id="full-name"
                name="full-name"
                placeholder="Enter your name"
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="05xxxxxxxx"
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
            >


            <label for="address">
                Delivery Address
            </label>

            <textarea
                id="address"
                name="address"
                placeholder="Your address"
            ></textarea>


            <!-- ==============================
                 PAYMENT METHOD
            =============================== -->

            <h2>
                Payment Method
            </h2>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="Mada"
                >

                <span>Mada</span>

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="Visa / Mastercard"
                >

                <span>Visa / Mastercard</span>

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="Apple Pay"
                >

                <span>Apple Pay</span>

            </label>

<button 
    type="button" 
    id="place-order-btn">
    Place Order
</button>

<div id="checkout-message"></div>
        


        </div>

  

</body>

</html>
