
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARQ | Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #171717;
    }

    #access-check {
      max-width: 600px;
      margin: 80px auto;
      padding: 30px 20px;
      text-align: center;
    }

    #access-check h2 {
      margin-bottom: 12px;
    }

    #access-check p {
      color: #555;
      line-height: 1.6;
    }

    .store-link {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    #admin-content[hidden],
    #access-check[hidden] {
      display: none !important;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 24px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      color: #ccc;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      background: white;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }

    .tabs button {
      padding: 12px 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      color: #222;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .tabs button.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    main {
      padding: 18px;
    }

    #admin-frame {
      display: block;
      width: 100%;
      height: 78vh;
      min-height: 600px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px;
      }

      .tabs {
        padding: 12px;
        gap: 8px;
      }

      .tabs button {
        flex: 1;
        padding: 12px 10px;
        font-size: 13px;
      }

      main {
        padding: 8px;
      }

      #admin-frame {
        min-height: 650px;
        height: 78vh;
      }
    }
  </style>
</head>

<body>
  <section id="access-check" role="status">
    <h2>⚡ BARQ Admin</h2>
    <p id="access-message">Checking your account permissions...</p>
    <a class="store-link" href="index.html">Return to Store</a>
  </section>

  <div id="admin-content" hidden>
    <header>
      <h1>⚡ BARQ Admin</h1>
      <p>Manage your online store in one place</p>
    </header>

    <nav class="tabs" aria-label="Admin sections">
      <button class="active" data-page="admin-products.html">
        Products
      </button>

      <button data-page="admin-orders.html">
        Orders
      </button>

      <button data-page="admin-reviews.html">
        Customer Reviews
      </button>
    </nav>

    <main>
      <iframe
        id="admin-frame"
        title="BARQ Admin Management"
      ></iframe>
    </main>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const accessCheck = document.getElementById("access-check");
    const accessMessage = document.getElementById("access-message");
    const adminContent = document.getElementById("admin-content");
    const frame = document.getElementById("admin-frame");
    const tabButtons = document.querySelectorAll(".tabs button");

    let checkInProgress = false;

    onAuthStateChanged(auth, async (user) => {
      if (checkInProgress) return;
      checkInProgress = true;

      adminContent.hidden = true;
      accessCheck.hidden = false;
      accessMessage.textContent = "Checking your account permissions...";

      try {
        if (!user) {
          accessMessage.textContent =
            "Please log in with your administrator account to access this page.";
          checkInProgress = false;
          return;
        }

        const adminSnapshot = await getDoc(
          doc(db, "admins", user.uid)
        );

        if (
          !adminSnapshot.exists() ||
          adminSnapshot.data().role !== "admin"
        ) {
          accessMessage.textContent =
            "Access denied. This page is only available to administrators.";
          checkInProgress = false;
          return;
        }

        // Only show the dashboard after administrator access is confirmed.
        adminContent.hidden = false;
        accessCheck.hidden = true;

        // Load the first admin page only after authorization.
        frame.src = "admin-products.html";

        tabButtons.forEach((button) => {
          button.addEventListener("click", () => {
            frame.src = button.dataset.page;

            tabButtons.forEach((tab) => {
              tab.classList.remove("active");
            });

            button.classList.add("active");
          });
        });
      } catch (error) {
        console.error("Admin dashboard access error:", error);

        accessMessage.textContent =
          "Unable to verify administrator access. Please refresh the page or try again later.";
      } finally {
        checkInProgress = false;
      }
    });
  </script>
</body>
</html>
