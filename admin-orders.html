<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BARQ Admin Orders</title>

    <link rel="stylesheet" href="admin-orders.css">

</head>


<body>

            <div>

                <h1>BARQ Admin</h1>

                <p>Customer Orders</p>

            </div>


            <button id="logout-btn">

        </header>

            <div id="orders-container">

            </div>


        </main>

    <script type="module" src="admin-orders.js"></script>
