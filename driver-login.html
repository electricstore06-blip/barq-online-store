<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BARQ Driver Login</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111111">


<style>

body {

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#f5f7fa;

    font-family:Arial,sans-serif;

}


.driver-login-box {

    width:90%;

    max-width:380px;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 5px 20px rgba(0,0,0,.1);

}


.logo {

    text-align:center;

    margin-bottom:20px;

}


.logo img {

    width:120px;

}


h1 {

    text-align:center;

    margin-bottom:25px;

}


input {

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border:1px solid #ddd;

    border-radius:8px;

    font-size:16px;

}


button {

    width:100%;

    padding:14px;

    background:#111827;

    color:white;

    border:none;

    border-radius:8px;

    font-size:16px;

    cursor:pointer;

}


button:hover {

    background:#000;

}


#message {

    text-align:center;

    margin-top:15px;

    color:#666;

}


</style>

</head>


<body>


<div class="driver-login-box">


<div class="logo">

<img src="barq-driver-icon-512.png">

</div>


<h1>
BARQ Driver
</h1>


<input 
id="email"
type="email"
placeholder="Driver Email">


<input
id="password"
type="password"
placeholder="Password">


<button id="login-btn">

Login

</button>


<div id="message"></div>


</div>
<script type="module" src="driver-login.js"></script>

<script>
if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("service-worker.js")
            .then(() => {
                console.log("BARQ Driver Service Worker Registered");
            })
            .catch((error) => {
                console.log(
                    "Service Worker Error:",
                    error
                );
            });

    });

}
</script>

</body>
</html>
