
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BARQ Driver</title>

    <!-- Keep Driver PWA installation -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="BARQ Driver">
</head>

<body>

    <p>Opening BARQ Login...</p>

    <!-- Keep Driver service worker registration -->
    <script>
        async function openBARQLogin() {

            if ("serviceWorker" in navigator) {
                try {
                    await navigator.serviceWorker.register(
                        "./driver-service-worker.js",
                        { scope: "./" }
                    );

                    console.log("BARQ Driver Service Worker registered.");

                } catch (error) {
                    console.error("Driver Service Worker error:", error);
                }
            }

            window.location.replace("./login.html");
        }

        window.addEventListener("load", openBARQLogin);
    </script>

</body>
</html>
