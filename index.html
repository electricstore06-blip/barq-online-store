<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
BARQ Checkout
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="top-bar">

🚚 Free Shipping | ❤️ Authentic Products | 🔒 Secure Payment

</div>




<header>


<div class="logo">

⚡ BARQ

<span>
ONLINE STORE
</span>


</div>


</header>





<section class="checkout-page">


<h1>
BARQ Checkout
</h1>



<div class="checkout-box">


<h2>
Customer Information
</h2>



<input type="text" placeholder="Full Name">


<input type="text" placeholder="Phone Number">


<input type="email" placeholder="Email">


<textarea placeholder="Delivery Address"></textarea>





<h2>
Payment Method
</h2>



<label>

<input type="radio" name="payment">

Mada

</label>



<br>



<label>

<input type="radio" name="payment">

Visa / Mastercard

</label>



<br>



<label>

<input type="radio" name="payment">

Apple Pay

</label>





<button>

Place Order

</button>



</div>



</section>





<footer>

<p>

© 2026 BARQ Online Store

</p>

</footer>



</body>


</html>
